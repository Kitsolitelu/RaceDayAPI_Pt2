# Starts the RaceDay website in a container with ONE command:
#     docker compose up --build
#
# The Part 2 API must already be running on this computer (https://localhost:7189),
# because the website gets all its data from the API.
services:
  web:
    build: ./RaceDayWeb
    image: raceday-web
    container_name: raceday-web
    ports:
      - "8080:8080"
    environment:
      # inside a container "localhost" means the container itself,
      # so the website reaches the API on your computer through host.docker.internal
      ApiSettings__BaseUrl: "https://host.docker.internal:7189"
      # the container does not trust the API's development certificate (development use only)
      ApiSettings__TrustDevCertificate: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
