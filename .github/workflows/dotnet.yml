name: RaceDay API CI

# runs every time code is pushed to GitHub (any branch) or a pull request is opened
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # if your solution (.slnx) file is NOT in the root of the repo, put its folder here
    # for example ./Part2 - if it is in the root, leave it as ./
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal
