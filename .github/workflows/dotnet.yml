name: RaceDay CI

# runs every time code is pushed to GitHub (any branch) or a pull request is opened
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build the whole solution (API, tests and MVC website)
        run: dotnet build --no-restore --configuration Release

      - name: Build the MVC project
        run: dotnet build RaceDayWeb/RaceDayWeb.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build the Docker image for the MVC website
        run: docker build -t raceday-web ./RaceDayWeb
